name: Supabase keep-alive
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase backends
        run: |
          for url in \
            "https://gieiiofpdgdrsctsrfam.supabase.co/auth/v1/health" \
            "https://pcxgmlptoninadehpbud.supabase.co/auth/v1/health" \
            "https://rojatrsblzrcsarwhhlq.supabase.co/auth/v1/health" \
            "https://ddhyfpoeznxsbfykobsh.supabase.co/auth/v1/health" \
            "https://pybhnhcdqajymsrskaae.supabase.co/auth/v1/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$url -> $code"
          done
      - name: Ping live platforms
        run: |
          for url in \
            "https://www.nairaspace.com" \
            "https://nairaspace-creator-hub.lovable.app" \
            "https://nspaceplus.nairaspace.com" \
            "https://amtacitizens.com" \
            "https://nspacemail.nairaspace.com" \
            "https://kruzcollection.com" \
            "https://emmaneagleeye.com"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$url" || echo "000")
            echo "$url -> $code"
          done
