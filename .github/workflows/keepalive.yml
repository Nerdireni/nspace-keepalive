name: Supabase keep-alive
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase backends
        run: |
          for url in \
            "https://gieiiofpdgdrsctsrfam.supabase.co/auth/v1/health" \
            "https://ddhyfpoeznxsbfykobsh.supabase.co/auth/v1/health" \
            "https://pybhnhcdqajymsrskaae.supabase.co/auth/v1/health"; do
            echo "Pinging $url"
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "$url"
          done
      - name: Ping live sites
        run: |
          for url in \
            "https://www.nairaspace.com" \
            "https://amtacitizens.com" \
            "https://nspacemail.nairaspace.com" \
            "https://kruzcollection.com"; do
            echo "Pinging $url"
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 -L "$url"
          done
